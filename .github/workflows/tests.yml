name: Pruebas

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sin dependencias: las pruebas usan el Google Chrome que ya trae la máquina de GitHub
      - name: Ejecutar las pruebas
        run: npm test

      - name: Pruebas del archivo único (Artifact)
        run: |
          node tools/artefacto.mjs
          ARTEFACTO=1 npm test
